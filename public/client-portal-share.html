<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Client Portal | LeadSig</title>
    <meta name="description" content="Open your LeadSig client portal to view jobs, schedules, photos, estimates, and invoices." />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Client Portal | LeadSig" />
    <meta property="og:description" content="View your jobs, schedules, photos, estimates, and invoices in one place." />
    <meta property="og:image" content="/client-portal-preview.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Client Portal | LeadSig" />
    <meta name="twitter:description" content="View your jobs, schedules, photos, estimates, and invoices in one place." />
    <meta name="twitter:image" content="/client-portal-preview.svg" />
  </head>
  <body>
    <script>
      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");
      const jobId = params.get("jobId");
      const portalParams = new URLSearchParams();
      if (token) portalParams.set("token", token);
      if (jobId) portalParams.set("jobId", jobId);
      const destination = portalParams.toString()
        ? `/client/job?${portalParams.toString()}`
        : "/client/job";
      window.location.replace(destination);
    </script>
  </body>
</html>
